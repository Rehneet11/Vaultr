global:
  scrape_interval: 15s # How often to scrape targets

scrape_configs:
  - job_name: 'vaultr-spring-boot'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # host.docker.internal allows the Docker container to talk to your Mac's localhost
      - targets: ['host.docker.internal:8080']