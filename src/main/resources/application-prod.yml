spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:shardingsphere:absolutepath:/opt/vaultr/sharding.yml}
  kafka:
    properties:
      ssl.truststore.location: /app/tmp/ca.pem
      ssl.keystore.location: /app/tmp/svc.pem
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  openapi:
    server-url: ${APP_OPENAPI_SERVER_URL:}

management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
