spring:
  datasource:
    url: jdbc:shardingsphere:file:/app/tmp/sharding.yml
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
